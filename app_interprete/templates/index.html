{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Automatas 1</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 45px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            font-size: 15px;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #7a42f4;
            box-shadow: 0 0 6px rgba(122, 66, 244, 0.3);
            outline: none;
        }

        input[type="submit"] {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: transform 0.1s ease, opacity 0.3s ease;
        }

        input[type="submit"]:hover {
            opacity: 0.9;
        }

        input[type="submit"]:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 25px;
            background-color: #f3f0ff;
            border: 1px solid #d3c7ff;
            border-radius: 8px;
            padding: 15px;
            color: #4a2c9a;
            font-size: 15px;
            text-align: left;
        }

        .result strong {
            color: #ff9f43;
        }
    </style>
</head>

<body>
    <h1>Autómatas 1</h1>

    <div class="container">
        <form method="post" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="x">Primer número (X)</label>
                <input type="number" id="x" name="x" required>
            </div>

            <div class="form-group">
                <label for="y">Segundo número (Y)</label>
                <input type="number" id="y" name="y" required>
            </div>

            <input type="submit" value="Calcular">
        </form>

        {% if resultado %}
        <div class="result">
            <p><strong>Multiplicación y suma +10 =</strong> {{ resultado.z }}</p>
            <p><strong>X incrementado en 1 =</strong> {{ resultado.x }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
