{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Automatas 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        /* Reset y cuerpo */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height:100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        /* Contenedor tipo tarjeta moderna */
        .container {
            background: #f0f4ff;
            width: 420px;
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de gradiente dinámico detrás del título */
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, #ff5858, #f09819, #667eea, #764ba2);
            animation: rotate 6s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            position: relative;
            z-index: 1;
            color: #fff;
            font-size: 36px;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        /* Formulario estilo neumorfismo */
        form {
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            box-shadow: inset 5px 5px 15px #d1d9ff,
                        inset -5px -5px 15px #ffffff;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            box-shadow: inset 2px 2px 8px #d1d9ff,
                        inset -2px -2px 8px #ffffff,
                        0 0 10px rgba(102,126,234,0.6);
        }

        input[type="submit"] {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            background: linear-gradient(45deg,#667eea,#764ba2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }

        /* Resultados grandes y animados */
        .result {
            margin-top: 35px;
            padding: 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #333;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Automatas Moderno</h1>

        <form action="{% url 'calcular' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="x">Número X</label>
                <input type="number" id="x" name="x" required>
            </div>
            <div class="form-group">
                <label for="y">Número Y</label>
                <input type="number" id="y" name="y" required>
            </div>
            <input type="submit" value="Calcular">
        </form>

        {% if resultado %}
        <div class="result">
            <p>Multiplicación + 10: <strong>{{ resultado.z }}</strong></p>
            <p>X incrementado en 1: <strong>{{ resultado.x }}</strong></p>
        </div>
        {% endif %}
    </div>

</body>
</html>
